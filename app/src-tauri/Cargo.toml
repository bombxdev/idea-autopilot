[package]
name = "idea-autopilot"
version = "0.6.0"
description = "Idea Autopilot — let an AI agent of your choice work through your ideas while you are away"
license = "GPL-3.0-or-later"
authors = ["bombxdev"]
repository = "https://github.com/bombxdev/idea-autopilot"
edition = "2021"
default-run = "idea-autopilot"

[lib]
name = "idea_autopilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
anyhow = "1"
dirs = "5"
parking_lot = "0.12"
tiny_http = "0.12"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[profile.release]
opt-level = "s"
lto = true
